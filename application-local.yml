spring:
  application:
    name: finance-manager
 datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/spendly}
    username: ${DB_USERNAME:change-me}
    password: ${DB_PASSWORD:change-me}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
server:
  port: 8080
  error:
    include-message: never
jwt:
  secret: ${JWT_SECRET:replace-with-a-secure-secret-at-least-32-characters-long}
  expiration: ${JWT_EXPIRATION:3600000}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  show-actuator: false
  default-produces-media-type: application/json
app:
  cors:
    allowed-origins:
      - http://localhost:5173
spring.data.web.pageable.max-page-size: 100
