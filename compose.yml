services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finance_manager
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance_manager"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  api:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/finance_manager
      DB_USERNAME: finance
      DB_PASSWORD: finance
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to at least 32 bytes}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
volumes:
  postgres-data:
