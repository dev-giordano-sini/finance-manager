services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finance_manager
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance_manager"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  api:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/finance_manager
      DB_USERNAME: finance
      DB_PASSWORD: finance
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to at least 32 bytes}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-data:
